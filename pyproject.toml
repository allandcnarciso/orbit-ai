[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orbit-ai"
description = "ORBIT AI - One Harness. Any Model. Infinite Possibilities."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "ORBIT AI Contributors" }]
keywords = ["ai", "agents", "llm", "harness", "openrouter", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0.32,<2.1",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "asgi-lifespan>=2.1,<3.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[project.urls]
Homepage = "https://github.com/allandcnarciso/orbit-ai"
Repository = "https://github.com/allandcnarciso/orbit-ai"
Issues = "https://github.com/allandcnarciso/orbit-ai/issues"

[tool.hatch.version]
path = "orbit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["orbit"]

[tool.hatch.build.targets.sdist]
include = ["orbit", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:orbit.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "workspace", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["orbit"]
strict = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true
