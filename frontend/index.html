<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ORBIT AI — One Harness. Any Model. Infinite Possibilities."
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%235b8cff'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6.5' fill='none' stroke='%235b8cff' stroke-width='1.6' transform='rotate(-28 16 16)' opacity='.65'/%3E%3C/svg%3E"
    />
    <title>ORBIT AI</title>
    <script>
      // Apply the persisted/system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("orbit.theme");
          var system = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark" ? stored : system;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
